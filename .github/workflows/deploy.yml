name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and prerender
        run: npm run build

      - name: Verify prerender output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sitemap.xml
          test -f dist/liposuction-chandigarh/index.html
          test -f dist/procedure/microvascular-repair/index.html
          echo "pages built: $(find dist -name index.html | wc -l)"

          # Trailing-slash guard. GitHub Pages 301s /slug to /slug/, so every
          # URL we advertise must already carry the slash - otherwise we point
          # Google at a redirect on every page (Search Console "Page with
          # redirect", Aug 2026). Fail the build if a bare <loc> reappears.
          if grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | grep -v '/</loc>'; then
            echo "::error::sitemap.xml contains URLs without a trailing slash (see above)"
            exit 1
          fi
          grep -q '<loc>https://drsumitaesthetics.com/liposuction-chandigarh/</loc>' dist/sitemap.xml
          echo "trailing-slash check: OK ($(grep -o '<loc>' dist/sitemap.xml | wc -l) URLs)"

      - name: Publish to gh-pages
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          npx gh-pages -d dist \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            -u "GitHub Actions <actions@github.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
