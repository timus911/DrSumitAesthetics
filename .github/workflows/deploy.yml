name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and prerender
        run: npm run build

      - name: Verify prerender output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sitemap.xml
          test -f dist/liposuction-chandigarh/index.html
          test -f dist/procedure/microvascular-repair/index.html
          echo "pages built: $(find dist -name index.html | wc -l)"

      - name: Publish to gh-pages
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d dist -u "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
